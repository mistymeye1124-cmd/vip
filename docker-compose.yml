services:
  vault_bot:
    build: .
    container_name: pro_access_vault_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./config.json:/app/config.json
      - /var/lib/vault_bot_storage/data:/app/data
    environment:
      - TZ=Asia/Dhaka
      - DATABASE_PATH=/app/data/vault.db
      - BACKUP_DIR=/app/data/backups

